name: Monthly Compliance Check
 
on:
  schedule:
    # 1st of every month, 13:00 UTC (~8-9am US Eastern depending on DST)
    - cron: "0 13 1 * *"
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Check compliance dates and send notifications
        run: node scripts/monthly-check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
 
